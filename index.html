<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>HOME BUDGET</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <img src="calculator.jpeg" alt="LOGO" />
      <div class="summary" id="summaryText">Możesz jeszcze wydać 0 złotych</div>
    </header>

    <main class="budget-columns">
      <section class="budget-column">
        <h2>PRZYCHODY</h2>
        <!-- Button to open modal for income -->
        <button class="btn btn-success mb-2" data-toggle="modal" data-target="#entryModal" data-type="income">Dodaj przychód</button>

        <ul id="incomeList"></ul>
        <div class="totals" id="incomeTotal">Suma przychodów: 0zł</div>
      </section>

      <section class="budget-column">
        <h2>WYDATKI</h2>
        <!-- Button to open modal for expense -->
        <button class="btn btn-danger mb-2" data-toggle="modal" data-target="#entryModal" data-type="expense">Dodaj wydatek</button>

        <ul id="expenseList"></ul>
        <div class="totals" id="expenseTotal">Suma wydatków: 0zł</div>
      </section>
    </main>
  </div>

  <!-- Bootstrap modal for adding entries -->
  <div class="modal fade" id="entryModal" tabindex="-1" role="dialog" aria-labelledby="entryModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <form id="modalForm" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="entryModalLabel">Dodaj wpis</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <!-- Input for entry description -->
          <input type="text" id="modalDescription" class="form-control mb-2" placeholder="Nazwa" required />
          <!-- Input for entry amount -->
          <input type="number" id="modalAmount" class="form-control" placeholder="Kwota" required />
        </div>
        <div class="modal-footer">
          <!-- Submit button -->
          <button type="submit" class="btn btn-primary">Dodaj</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JavaScript and dependencies -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Your app JavaScript -->
  <script src="app.js"></script>
</body>
</html>
